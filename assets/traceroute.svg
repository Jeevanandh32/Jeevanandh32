<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="372" viewBox="0 0 1280 372" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace">
  <title>traceroute of my career: Northeastern, Global Partners, CloudBridge, FabricPilot, TradeHunt, your team</title>
  <defs>
    <style>
      .bar { fill: #111a2b; }
      .t { font-size: 16px; fill: #cbd5e1; }
      .p { fill: #4ade80; } .c { fill: #ffffff; font-weight: 700; }
      .n { fill: #64748b; } .h { fill: #7dd3fc; font-weight: 700; } .ms { fill: #64748b; }
      .ok { fill: #4ade80; font-weight: 700; }
      .caret { animation: blink 1s steps(1, end) infinite; }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="372" rx="14" fill="#0b1220"/>
  <path d="M 14 0 H 1266 A 14 14 0 0 1 1280 14 V 40 H 0 V 14 A 14 14 0 0 1 14 0 Z" class="bar"/>
  <circle cx="26" cy="20" r="6" fill="#f87171"/><circle cx="46" cy="20" r="6" fill="#fbbf24"/><circle cx="66" cy="20" r="6" fill="#4ade80"/>
  <text x="640" y="25" font-size="13" fill="#64748b" text-anchor="middle">jeevanandh@boston: ~</text>

  <g><text x="28" y="80" class="t"><tspan class="p">$</tspan> <tspan class="c">traceroute</tspan> jeevanandh-ravi --show-what-i-measured</text></g>
  <g><text x="28" y="112" class="t"><tspan class="n">traceroute to your-team (open to relocation), 6 hops max</tspan></text></g>

