  <g><text x="28" y="180" class="t n">2</text><text x="56" y="180" class="t h">global-partners.wan</text><text x="300" y="180" class="t">890+ retail sites · 300+ incidents · 88% same-day</text><text x="1252" y="180" class="t ms" text-anchor="end">2.4 ms</text></g>
  <g><text x="28" y="212" class="t n">3</text><text x="56" y="212" class="t h">cloudbridge.aws-azure</text><text x="300" y="212" class="t">4 IPsec/eBGP tunnels · 36.4 s DNS failover with Route 53 down</text><text x="1252" y="212" class="t ms" text-anchor="end">12.5 ms</text></g>
