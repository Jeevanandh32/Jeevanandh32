<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"><title>How I use AI: the agent drafts, the lab decides, I approve</title><style>.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.flow{animation:flow 1.2s linear infinite}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}@keyframes flow{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.ring,.flow{animation:none;opacity:0}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d1b33"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="1280" height="350" rx="16" fill="url(#bg)"/><rect width="1280" height="350" rx="16" fill="url(#g)"/><text x="40" y="52" font-size="14" fill="#7dd3fc" font-weight="700" text-anchor="start">HOW I USE AI</text><text x="40" y="86" font-size="27" fill="#ffffff" font-weight="800" text-anchor="start">The agent drafts. The lab decides. I approve.</text><rect x="40" y="116" width="226" height="86" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="1.6"/><circle cx="64" cy="142" r="13" fill="#a78bfa"/><text x="64" y="147" font-size="14" fill="#0b1220" font-weight="800" text-anchor="middle">1</text><text x="86" y="148" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Agent drafts</text><text x="56" y="180" font-size="12.5" fill="#a9b8cf" font-weight="400" text-anchor="start">code, configs, tests</text><line x1="269" y1="159" x2="285" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="288" y="116" width="226" height="86" rx="12" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.6"/><circle cx="312" cy="142" r="13" fill="#38bdf8"/><text x="312" y="147" font-size="14" fill="#0b1220" font-weight="800" text-anchor="middle">2</text><text x="334" y="148" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Lab runs it</text><text x="304" y="180" font-size="12.5" fill="#a9b8cf" font-weight="400" text-anchor="start">Cisco · Juniper · Arista · cloud</text><line x1="517" y1="159" x2="533" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="536" y="116" width="226" height="86" rx="12" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="1.6"/><circle cx="560" cy="142" r="13" fill="#4ade80"/><text x="560" y="147" font-size="14" fill="#0b1220" font-weight="800" text-anchor="middle">3</text><text x="582" y="148" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Tests + metrics</text><text x="552" y="180" font-size="12.5" fill="#a9b8cf" font-weight="400" text-anchor="start">unit tests · benchmarks · live</text><line x1="765" y1="159" x2="781" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="784" y="116" width="226" height="86" rx="12" fill="#facc15" fill-opacity="0.08" stroke="#facc15" stroke-width="1.6"/><circle cx="808" cy="142" r="13" fill="#facc15"/><text x="808" y="147" font-size="14" fill="#0b1220" font-weight="800" text-anchor="middle">4</text><text x="830" y="148" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">I review</text><text x="800" y="180" font-size="12.5" fill="#a9b8cf" font-weight="400" text-anchor="start">read diffs, check numbers</text><line x1="1013" y1="159" x2="1029" y2="159" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="1032" y="116" width="226" height="86" rx="12" fill="#fb923c" fill-opacity="0.08" stroke="#fb923c" stroke-width="1.6"/><circle cx="1056" cy="142" r="13" fill="#fb923c"/><text x="1056" y="147" font-size="14" fill="#0b1220" font-weight="800" text-anchor="middle">5</text><text x="1078" y="148" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Ship or roll back</text><text x="1048" y="180" font-size="12.5" fill="#a9b8cf" font-weight="400" text-anchor="start">canary · health gate · rollback</text><path class="flow" d="M 1145.0 208 V 228 H 153.0 V 208" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)"/><path id="tok" d="M 50 159 H 1248 L 1145.0 208 V 228 H 153.0 V 208 Z" fill="none"/><circle r="6" fill="#ffffff" opacity="0.9"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#tok"/></animateMotion></circle><text x="640" y="244" font-size="12.5" fill="#64748b" font-weight="400" text-anchor="middle">failed check → back to the agent with the evidence</text><text x="40" y="292" font-size="13" fill="#7dd3fc" font-weight="700" text-anchor="start">Evidence from my projects</text><rect x="40" y="304" width="466" height="26" rx="7" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35"/><text x="272.75" y="321.5" font-size="12.5" fill="#e2e8f0" font-weight="500" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">MindBridge AI blocked 2 bad Terraform changes before apply</text><rect x="519.5" y="304" width="357" height="26" rx="7" fill="#4ade80" fill-opacity="0.10" stroke="#4ade80" stroke-opacity="0.35"/><text x="698.0" y="321.5" font-size="12.5" fill="#e2e8f0" font-weight="500" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">FabricPilot: 54 tests + canary auto-rollback</text><rect x="890.5" y="304" width="310" height="26" rx="7" fill="#facc15" fill-opacity="0.10" stroke="#facc15" stroke-opacity="0.35"/><text x="1045.75" y="321.5" font-size="12.5" fill="#e2e8f0" font-weight="500" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">ProbePulse: operator-approved recovery</text></svg>